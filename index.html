<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ganttly — Beautiful Gantt Charts</title>
<style>
  :root {
    /* Office-like chrome */
    --accent: #185abd;
    --accent-dark: #124a9c;
    --accent-soft: #e5eefb;
    --bg: #f3f3f3;
    --panel: #ffffff;
    --ink: #1f1f1f;
    --ink-soft: #605e5c;
    --line: #d2d0ce;
    --line-soft: #edebe9;
    --head-bg: #f8f8f8;
    --weekend: #f2f2f2;
    --today: #d13438;
    --radius: 3px;

    /* Shared row geometry: grid rows and timeline lanes both use these */
    --row-h: 32px;
    --detail-h: 44px;
    --header-h: 48px;

    /* Grid columns: ID, toggle, name, duration, start, finish, % */
    --cols: 40px 26px 200px 72px 116px 116px 82px;
    --grid-w: 654px; /* sum of --cols + 2px pane border */

    --font: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  html, body { height: 100%; }
  body {
    font-family: var(--font); font-size: 13px;
    background: var(--bg); color: var(--ink);
    display: flex; flex-direction: column;
    height: 100vh; height: 100dvh; overflow: hidden;
  }

  /* ---------- Title bar ---------- */
  .titlebar {
    display: flex; align-items: center; gap: 14px;
    background: var(--accent); color: #fff;
    padding: 6px 14px; min-height: 42px; flex: 0 0 auto;
  }
  .logo { font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .logo .mark {
    width: 20px; height: 20px; border-radius: 2px; background: #fff; position: relative; display: inline-block;
  }
  .logo .mark::before, .logo .mark::after {
    content: ""; position: absolute; height: 4px; background: var(--accent); border-radius: 1px;
  }
  .logo .mark::before { left: 3px; top: 5px; width: 9px; }
  .logo .mark::after { left: 8px; top: 11px; width: 9px; }
  #projectTitle {
    font: inherit; font-size: 14px; font-weight: 600; color: #fff;
    background: rgba(255,255,255,.12); border: 1px solid transparent; border-radius: var(--radius);
    padding: 5px 9px; min-width: 0; flex: 0 1 420px;
  }
  #projectTitle:hover { border-color: rgba(255,255,255,.4); }
  #projectTitle:focus { outline: none; background: #fff; color: var(--ink); }

  /* ---------- Ribbon ---------- */
  .ribbon {
    display: flex; align-items: stretch; flex-wrap: wrap;
    background: var(--head-bg); border-bottom: 1px solid var(--line);
    padding: 4px 6px 0; flex: 0 0 auto;
  }
  .ribbon-group {
    display: flex; flex-direction: column; align-items: center;
    padding: 0 10px; border-right: 1px solid var(--line-soft);
  }
  .ribbon-group .cmds { display: flex; align-items: center; gap: 2px; min-height: 42px; }
  .ribbon-group .caption {
    font-size: 11px; color: var(--ink-soft); padding: 1px 0 4px; white-space: nowrap;
  }
  .ribbon .info {
    margin-left: auto; align-self: center; padding: 0 10px 4px;
    font-size: 12px; color: var(--ink-soft); white-space: nowrap;
  }
  .btn {
    appearance: none; border: 1px solid transparent; background: none; color: var(--ink);
    font: inherit; font-size: 12.5px; padding: 5px 9px; border-radius: var(--radius);
    cursor: pointer; display: inline-flex; flex-direction: column; align-items: center; gap: 2px;
    white-space: nowrap; line-height: 1.2;
  }
  .btn:hover { background: var(--accent-soft); border-color: #c7dcf5; }
  .btn:active { background: #cfe0f7; }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .btn svg { width: 20px; height: 20px; color: var(--accent); }
  .btn.small { flex-direction: row; padding: 5px 8px; font-weight: 700; font-size: 15px; }
  #zoomLabel { font-size: 12px; font-weight: 600; color: var(--ink-soft); min-width: 58px; text-align: center; }

  /* ---------- Workspace (single scroll container) ---------- */
  .workspace { flex: 1 1 auto; min-height: 0; overflow: auto; background: var(--panel); position: relative; }
  .split { display: flex; min-width: 100%; width: max-content; min-height: 100%; }

  /* ---------- Grid pane ---------- */
  .grid-pane {
    position: sticky; left: 0; z-index: 4;
    flex: 0 0 var(--grid-w); width: var(--grid-w);
    background: var(--panel); border-right: 2px solid var(--line);
  }
  .grid-head, .row, .detail { display: grid; grid-template-columns: var(--cols); }
  .grid-head {
    position: sticky; top: 0; z-index: 2; height: var(--header-h);
    background: var(--head-bg); border-bottom: 1px solid var(--line);
  }
  .grid-head > div {
    display: flex; align-items: flex-end; padding: 0 6px 6px;
    font-size: 12px; font-weight: 600; color: var(--ink-soft);
    border-right: 1px solid var(--line-soft); white-space: nowrap; overflow: hidden;
  }
  .row {
    height: var(--row-h); border-bottom: 1px solid var(--line-soft); background: var(--panel);
  }
  .row:hover { background: #f5f9fe; }
  .row > * { border-right: 1px solid var(--line-soft); min-width: 0; }
  .cell-id {
    display: flex; align-items: center; justify-content: center;
    background: var(--head-bg); color: var(--ink-soft); font-size: 12px;
  }
  .cell-toggle { display: flex; align-items: center; justify-content: center; }
  .toggle {
    appearance: none; border: none; background: none; cursor: pointer; color: var(--ink-soft);
    width: 20px; height: 20px; border-radius: 2px; line-height: 0; display: grid; place-items: center;
  }
  .toggle:hover { background: var(--accent-soft); color: var(--accent); }
  .toggle:focus-visible { outline: 2px solid var(--accent); }
  .toggle svg { width: 12px; height: 12px; transition: transform .12s; }
  .toggle[aria-expanded="true"] svg { transform: rotate(90deg); }
  .cell-pct { display: flex; align-items: center; justify-content: flex-end; padding: 0 8px; font-variant-numeric: tabular-nums; }
  .row input, .detail input[type="date"], .detail input[type="number"] {
    width: 100%; height: 100%; font: inherit; font-size: 12.5px; color: var(--ink);
    border: 1px solid transparent; background: transparent; padding: 0 6px; border-radius: 0;
  }
  .row input:hover { border-color: var(--line); }
  .row input:focus, .detail input:focus { outline: none; border-color: var(--accent); background: #fff; box-shadow: inset 0 0 0 1px var(--accent); }
  .row input[type="number"], .detail input[type="number"] { text-align: right; }
  .cell-dur { display: flex; align-items: center; }
  .cell-dur input { flex: 1 1 auto; min-width: 0; padding-right: 2px; -moz-appearance: textfield; }
  .cell-dur input::-webkit-inner-spin-button { opacity: .6; }
  .cell-dur span { padding-right: 6px; color: var(--ink-soft); font-size: 12px; }

  .detail {
    height: var(--detail-h); border-bottom: 1px solid var(--line-soft); background: #fafafa;
  }
  .detail-body {
    grid-column: 3 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px;
    padding: 0 8px; font-size: 12px; color: var(--ink-soft);
  }
  .detail-body label { display: flex; align-items: center; gap: 6px; }
  .swatches { display: flex; gap: 4px; }
  .swatch {
    width: 18px; height: 18px; border-radius: 2px; cursor: pointer; border: 2px solid transparent;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); padding: 0;
  }
  .swatch.active { border-color: var(--ink); }
  .swatch:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .detail input[type="range"] { width: 120px; accent-color: var(--accent); }
  .progress-val { min-width: 34px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
  .del {
    appearance: none; border: 1px solid var(--line); background: #fff; color: var(--ink); cursor: pointer;
    font: inherit; font-size: 12px; padding: 3px 8px; border-radius: var(--radius); display: inline-flex; gap: 4px; align-items: center;
  }
  .del:hover { border-color: var(--today); color: var(--today); }
  .del svg { width: 13px; height: 13px; }
  .narrow-only { display: none !important; }
  .detail .narrow-only input { width: 120px; height: 26px; border: 1px solid var(--line); border-radius: var(--radius); background: #fff; }
  .detail .narrow-only input[type="number"] { width: 64px; }
  .grid-empty { padding: 28px 16px; color: var(--ink-soft); text-align: center; }

  /* ---------- Timeline pane ---------- */
  .timeline-pane { flex: 1 0 auto; position: relative; background: var(--panel); }
  .timescale { position: sticky; top: 0; z-index: 2; background: var(--head-bg); border-bottom: 1px solid var(--line); height: var(--header-h); }
  .tier { display: flex; height: calc(var(--header-h) / 2); }
  .tier + .tier { border-top: 1px solid var(--line-soft); }
  .month-cell {
    flex: 0 0 auto; font-size: 12px; font-weight: 600; color: var(--ink);
    padding: 0 6px; display: flex; align-items: center;
    border-left: 1px solid var(--line); overflow: hidden; white-space: nowrap;
  }
  .day-cell {
    flex: 0 0 auto; font-size: 11px; color: var(--ink-soft);
    display: flex; align-items: center; justify-content: center;
    border-left: 1px solid var(--line-soft);
  }
  .day-cell.weekend { background: var(--weekend); }
  .day-cell.today span { background: var(--today); color: #fff; font-weight: 700; border-radius: 2px; padding: 1px 4px; }
  .tl-body { position: relative; }
  .tl-cols { position: absolute; inset: 0; pointer-events: none; }
  .day-col { position: absolute; top: 0; bottom: 0; border-left: 1px solid var(--line-soft); }
  .day-col.weekend { background: var(--weekend); }
  .today-line { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--today); z-index: 3; pointer-events: none; }
  /* "Today" flag lives in the timescale's month tier so it never covers bar labels */
  .today-flag {
    position: absolute; top: calc(var(--header-h) / 4); transform: translateY(-50%); margin-left: 4px; z-index: 1;
    font-size: 10px; font-weight: 700; color: #fff; background: var(--today);
    padding: 1px 4px; border-radius: 2px; white-space: nowrap; pointer-events: none;
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  .lane { position: relative; height: var(--row-h); border-bottom: 1px solid var(--line-soft); }
  .lane.spacer { height: var(--detail-h); }
  .bar {
    position: absolute; top: 50%; transform: translateY(-50%);
    height: calc(var(--row-h) * .56); border-radius: 3px; z-index: 2;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.28);
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  .bar .fill {
    position: absolute; left: 0; top: 33%; height: 34%;
    background: rgba(0,0,0,.42); border-radius: 1px 0 0 1px;
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  .bar-label {
    position: absolute; top: 50%; transform: translateY(-50%); z-index: 2;
    font-size: 12px; font-weight: 600; color: var(--ink); white-space: nowrap; pointer-events: none;
  }

  /* ---------- Toast ---------- */
  .toast {
    position: fixed; bottom: 22px; left: 50%; transform: translate(-50%, 20px);
    background: var(--ink); color: #fff; font-size: 13px; font-weight: 600;
    padding: 10px 16px; border-radius: var(--radius); box-shadow: 0 4px 14px rgba(0,0,0,.2);
    opacity: 0; pointer-events: none; transition: .25s; z-index: 100;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  .print-only { display: none; }

  /* ---------- Narrow screens ---------- */
  @media (max-width: 979px) {
    :root {
      --cols: 34px 26px minmax(0, 1fr);
      --grid-w: 180px;
      --detail-h: 184px;
    }
    .detail input[type="range"] { width: 76px; }
    .c-dur, .c-start, .c-fin, .c-pct { display: none !important; }
    .narrow-only { display: flex !important; }
    .detail-body { grid-column: 1 / -1; padding: 6px 8px; align-content: center; }
    .ribbon .info { display: none; }
    .ribbon-group { padding: 0 6px; }
    .titlebar { gap: 10px; }
  }

  /* ---------- Print ---------- */
  @media print {
    @page { size: landscape; margin: 10mm; }
    :root { --cols: 34px 0px 200px 64px 92px 92px 72px; --grid-w: 556px; }
    body { display: block; height: auto; overflow: visible; background: #fff; }
    .titlebar, .ribbon, .toast, .detail, .lane.spacer, .toggle { display: none !important; }
    .print-only { display: block; }
    .print-head { padding: 0 0 8px; }
    .print-head h1 { font-size: 18px; }
    .print-head p { font-size: 11px; color: var(--ink-soft); }
    .workspace { overflow: visible; height: auto; }
    .split { width: auto; min-width: 0; }
    .grid-pane, .grid-head, .timescale { position: static; }
    .row input { border: none !important; background: none !important; box-shadow: none !important; appearance: none; -webkit-appearance: none; padding: 0 4px; }
    .row input::-webkit-calendar-picker-indicator, .row input::-webkit-inner-spin-button { display: none; -webkit-appearance: none; }
    .row input[type="number"] { -moz-appearance: textfield; }
    .row:hover { background: none; }
    .day-col.weekend, .day-cell.weekend, .cell-id, .grid-head, .timescale, .today-line, .day-cell.today span {
      -webkit-print-color-adjust: exact; print-color-adjust: exact;
    }
  }
</style>
</head>
<body>

<header class="titlebar">
  <div class="logo"><span class="mark"></span>Ganttly</div>
  <input id="projectTitle" type="text" value="My Project" maxlength="80" aria-label="Project title">
</header>

<nav class="ribbon" aria-label="Commands">
  <div class="ribbon-group" role="group" aria-labelledby="capTask">
    <div class="cmds">
      <button class="btn" id="addTaskBtn" title="Add a new task">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="5" width="14" height="5" rx="1"/><path d="M19 14v6M16 17h6M3 15h9"/></svg>
        Add task
      </button>
    </div>
    <div class="caption" id="capTask">Task</div>
  </div>
  <div class="ribbon-group" role="group" aria-labelledby="capShare">
    <div class="cmds">
      <button class="btn" id="copyLinkBtn" title="Copy a shareable link with all chart data">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        Copy link
      </button>
    </div>
    <div class="caption" id="capShare">Share</div>
  </div>
  <div class="ribbon-group" role="group" aria-labelledby="capView">
    <div class="cmds">
      <button class="btn small" id="zoomOutBtn" title="Zoom out (Ctrl/⌘ + −)" aria-label="Zoom out">−</button>
      <span id="zoomLabel" aria-live="polite">Normal</span>
      <button class="btn small" id="zoomInBtn" title="Zoom in (Ctrl/⌘ + +)" aria-label="Zoom in">+</button>
    </div>
    <div class="caption" id="capView">View</div>
  </div>
  <div class="ribbon-group" role="group" aria-labelledby="capFile">
    <div class="cmds">
      <button class="btn" id="printBtn" title="Print the chart">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
        Print
      </button>
    </div>
    <div class="caption" id="capFile">File</div>
  </div>
  <div class="info" id="chartSub"></div>
</nav>

<div class="print-only print-head">
  <h1 id="printTitle"></h1>
  <p id="printSub"></p>
</div>

<div class="workspace" id="workspace">
  <div class="split">
    <section class="grid-pane" id="gridPane" aria-label="Task table">
      <div class="grid-head" role="row">
        <div>ID</div><div aria-label="Expand"></div><div>Task Name</div>
        <div class="c-dur">Duration</div><div class="c-start">Start</div><div class="c-fin">Finish</div><div class="c-pct">% Complete</div>
      </div>
      <div id="gridBody"></div>
    </section>
    <section class="timeline-pane" id="timelinePane" aria-label="Timeline"></section>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
(function () {
  "use strict";

  const COLORS = ["#1f5fd1", "#00897b", "#b26a00", "#c2185b", "#6a1b9a", "#0277bd", "#d84315", "#455a64"];
  const DAY_MS = 86400000;

  // Zoom presets: px per day
  const ZOOMS = [
    { w: 14, label: "Compact" },
    { w: 24, label: "Cozy" },
    { w: 34, label: "Normal" },
    { w: 52, label: "Large" },
    { w: 76, label: "Huge" }
  ];
  let zoomIdx = 2;
  const dayW = () => ZOOMS[zoomIdx].w;
  function clampZoom(z) {
    z = parseInt(z);
    return isNaN(z) ? 2 : Math.min(Math.max(z, 0), ZOOMS.length - 1);
  }

  // ---------- State ----------
  let state = { title: "My Project", tasks: [] };
  // UI-only: which task objects have their detail strip open (not persisted)
  const expanded = new Set();

  function iso(d) {
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function parseDate(s) {
    const [y, m, d] = s.split("-").map(Number);
    return new Date(y, m - 1, d);
  }
  function addDays(d, n) { const r = new Date(d); r.setDate(r.getDate() + n); return r; }
  function durationOf(t) { return Math.max(1, Math.round((parseDate(t.e) - parseDate(t.s)) / DAY_MS) + 1); }

  function defaultState() {
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const mk = (name, off, dur, c, p) => ({ n: name, s: iso(addDays(today, off)), e: iso(addDays(today, off + dur - 1)), c, p });
    return {
      title: "Website Relaunch",
      tasks: [
        mk("Research & strategy", -4, 5, 0, 100),
        mk("Wireframes", 1, 4, 4, 80),
        mk("Visual design", 5, 6, 3, 45),
        mk("Development", 10, 10, 1, 20),
        mk("Content & copywriting", 8, 7, 2, 60),
        mk("Testing & QA", 19, 4, 5, 0),
        mk("Launch 🚀", 23, 1, 6, 0)
      ]
    };
  }

  // ---------- URL serialization ----------
  // v2 format: ?d=<base64url(JSON {t, z, tasks})>
  // Legacy v1 format (?t=...&d=name|start|end|color|progress~...) is still readable.
  function b64encode(str) {
    return btoa(unescape(encodeURIComponent(str)))
      .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }
  function b64decode(str) {
    const s = str.replace(/-/g, "+").replace(/_/g, "/");
    const pad = "====".slice(0, (4 - (s.length % 4)) % 4);
    return decodeURIComponent(escape(atob(s + pad)));
  }

  function sanitizeTask(f) {
    const todayIso = iso(new Date());
    return {
      n: String(f.n == null ? "Task" : f.n).slice(0, 120),
      s: /^\d{4}-\d{2}-\d{2}$/.test(f.s) ? f.s : todayIso,
      e: /^\d{4}-\d{2}-\d{2}$/.test(f.e) ? f.e : (f.s || todayIso),
      c: Math.min(Math.max(parseInt(f.c) || 0, 0), COLORS.length - 1),
      p: Math.min(Math.max(parseInt(f.p) || 0, 0), 100)
    };
  }

  function encodeState() {
    const payload = JSON.stringify({ v: 2, t: state.title, z: zoomIdx, tasks: state.tasks });
    return "?d=" + b64encode(payload);
  }

  function decodeState() {
    const p = new URLSearchParams(location.search);
    const raw = p.get("d");
    if (!raw) return null;

    // v2: base64url-encoded JSON
    try {
      const o = JSON.parse(b64decode(raw));
      if (o && Array.isArray(o.tasks)) {
        zoomIdx = clampZoom(o.z);
        return { title: String(o.t || "My Project"), tasks: o.tasks.map(sanitizeTask) };
      }
    } catch (e) { /* not v2 — fall through to legacy */ }

    // v1 legacy: name|start|end|colorIdx|progress~...
    const tasks = raw.split("~").filter(Boolean).map(row => {
      const f = row.split("|").map(decodeURIComponent);
      return sanitizeTask({ n: f[0], s: f[1], e: f[2], c: f[3], p: f[4] });
    });
    zoomIdx = clampZoom(p.get("z"));
    return { title: p.get("t") || "My Project", tasks };
  }

  function syncURL() {
    history.replaceState(null, "", location.pathname + encodeState());
  }

  // ---------- Toast ----------
  const toastEl = document.getElementById("toast");
  let toastTimer;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2200);
  }

  function escapeAttr(s) {
    return String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function escapeHtml(s) {
    const div = document.createElement("div");
    div.textContent = s;
    return div.innerHTML;
  }

  // ---------- Task grid ----------
  const gridBody = document.getElementById("gridBody");
  const titleInput = document.getElementById("projectTitle");
  const workspaceEl = document.getElementById("workspace");
  const gridPane = document.getElementById("gridPane");

  const ICON_CHEVRON = `<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2l4 4-4 4"/></svg>`;
  const ICON_TRASH = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>`;

  // Rebuilt only on structural changes (load, add, delete, expand/collapse).
  // Cell edits patch the row in place via syncRow() so inputs keep focus.
  function renderGrid() {
    if (!state.tasks.length) {
      gridBody.innerHTML = `<div class="grid-empty">No tasks yet — use <b>Add task</b> in the ribbon to start your plan.</div>`;
      return;
    }
    gridBody.innerHTML = state.tasks.map((t, i) => {
      const open = expanded.has(t);
      const dur = durationOf(t);
      const row = `
        <div class="row" role="row" data-i="${i}">
          <div class="cell-id">${i + 1}</div>
          <div class="cell-toggle"><button class="toggle" aria-expanded="${open}" aria-label="${open ? "Collapse" : "Expand"} options for task ${i + 1}" title="Task options">${ICON_CHEVRON}</button></div>
          <div><input type="text" data-k="n" value="${escapeAttr(t.n)}" maxlength="120" aria-label="Task name"></div>
          <div class="c-dur cell-dur"><input type="number" data-k="d" min="1" step="1" value="${dur}" aria-label="Duration in days" title="Duration in days"><span>days</span></div>
          <div class="c-start"><input type="date" data-k="s" value="${t.s}" aria-label="Start"></div>
          <div class="c-fin"><input type="date" data-k="e" value="${t.e}" aria-label="Finish"></div>
          <div class="cell-pct c-pct" data-pct>${t.p}%</div>
        </div>`;
      if (!open) return row;
      return row + `
        <div class="detail" data-i="${i}">
          <div class="detail-body">
            <span class="swatches" role="radiogroup" aria-label="Bar colour">${COLORS.map((c, ci) =>
              `<button type="button" class="swatch${ci === t.c ? " active" : ""}" data-c="${ci}" style="background:${c}" role="radio" aria-checked="${ci === t.c}" aria-label="Colour ${ci + 1}" title="Colour ${ci + 1}"></button>`
            ).join("")}</span>
            <label>Progress <input type="range" min="0" max="100" step="5" value="${t.p}" data-k="p" aria-label="Progress"><span class="progress-val" data-pct>${t.p}%</span></label>
            <label class="narrow-only">Start <input type="date" data-k="s" value="${t.s}"></label>
            <label class="narrow-only">Finish <input type="date" data-k="e" value="${t.e}"></label>
            <label class="narrow-only">Duration <input type="number" data-k="d" min="1" step="1" value="${dur}"> days</label>
            <button type="button" class="del" title="Delete task">${ICON_TRASH} Delete</button>
          </div>
        </div>`;
    }).join("");
  }

  // Patch every field of task i (row + detail strip) except the one being typed in.
  function syncRow(i) {
    const t = state.tasks[i];
    const vals = { n: t.n, s: t.s, e: t.e, d: String(durationOf(t)), p: String(t.p) };
    gridBody.querySelectorAll(`[data-i="${i}"] [data-k]`).forEach(inp => {
      if (inp !== document.activeElement && inp.value !== vals[inp.dataset.k]) inp.value = vals[inp.dataset.k];
    });
    gridBody.querySelectorAll(`[data-i="${i}"] [data-pct]`).forEach(el => { el.textContent = t.p + "%"; });
  }

  const MAX_DURATION = 3650;

  gridBody.addEventListener("input", e => {
    const inp = e.target, k = inp.dataset.k;
    const host = inp.closest("[data-i]");
    if (!k || !host) return;
    const i = +host.dataset.i, t = state.tasks[i];
    if (k === "n") t.n = inp.value;
    else if (k === "s") { if (!inp.value) return; t.s = inp.value; if (t.e < t.s) t.e = t.s; }
    else if (k === "e") { if (!inp.value) return; t.e = inp.value; if (t.e < t.s) t.s = t.e; }
    else if (k === "d") {
      const d = Number(inp.value);
      if (!Number.isInteger(d) || d < 1 || d > MAX_DURATION) return; // ignored while typing, reset on blur
      t.e = iso(addDays(parseDate(t.s), d - 1));
    }
    else if (k === "p") t.p = +inp.value;
    syncRow(i);
    update();
  });

  // Invalid durations / emptied dates snap back to the real value when the field loses focus
  gridBody.addEventListener("focusout", e => {
    const host = e.target.closest && e.target.closest("[data-i]");
    if (!host || !e.target.dataset.k) return;
    const i = +host.dataset.i;
    setTimeout(() => { if (state.tasks[i]) syncRow(i); });
  });

  gridBody.addEventListener("click", e => {
    const host = e.target.closest("[data-i]");
    if (!host) return;
    const i = +host.dataset.i, t = state.tasks[i];

    if (e.target.closest(".toggle")) {
      if (expanded.has(t)) expanded.delete(t); else expanded.add(t);
      renderGrid();
      renderTimeline();
      const btn = gridBody.querySelector(`.row[data-i="${i}"] .toggle`);
      if (btn) btn.focus();
      return;
    }
    const sw = e.target.closest(".swatch");
    if (sw) {
      t.c = +sw.dataset.c;
      host.querySelectorAll(".swatch").forEach(x => {
        const on = x === sw;
        x.classList.toggle("active", on);
        x.setAttribute("aria-checked", on);
      });
      update();
      return;
    }
    if (e.target.closest(".del")) {
      state.tasks.splice(i, 1);
      expanded.delete(t);
      update();
      renderGrid();
      toast("Task deleted");
    }
  });

  // ---------- Timeline ----------
  const timelineEl = document.getElementById("timelinePane");
  const chartSubEl = document.getElementById("chartSub");

  let measureCtx;
  function labelWidth(text) {
    if (!measureCtx) {
      measureCtx = document.createElement("canvas").getContext("2d");
      measureCtx.font = "600 12px " + getComputedStyle(document.body).fontFamily;
    }
    return Math.ceil(measureCtx.measureText(text).width);
  }

  function renderTimeline() {
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const w = dayW();
    const tasks = state.tasks;
    const fmt = new Intl.DateTimeFormat(undefined, { day: "numeric", month: "short", year: "numeric" });

    // Range: task span padded −2/+3 days (or around today when empty)
    let min = null, max = null;
    tasks.forEach(t => {
      const s = parseDate(t.s), e = parseDate(t.e);
      if (!min || s < min) min = s;
      if (!max || e > max) max = e;
    });
    if (tasks.length) {
      min = addDays(min, -2);
      max = addDays(max, 3);
      chartSubEl.textContent = `${fmt.format(min)} — ${fmt.format(max)} · ${tasks.length} task${tasks.length > 1 ? "s" : ""}`;
    } else {
      min = addDays(today, -2);
      max = addDays(today, 3);
      chartSubEl.textContent = "No tasks";
    }
    document.getElementById("printSub").textContent = chartSubEl.textContent;

    // Extend right so labels beside bars are never clipped …
    let needPx = (Math.round((max - min) / DAY_MS) + 1) * w;
    tasks.forEach(t => {
      const right = (Math.round((parseDate(t.e) - min) / DAY_MS) + 1) * w;
      needPx = Math.max(needPx, right + 6 + labelWidth(t.n) + 12);
    });
    // … and so the timeline fills the visible width (floor: never overflow it by a partial day)
    const avail = workspaceEl.clientWidth - gridPane.offsetWidth;
    const totalDays = Math.max(Math.ceil(needPx / w), Math.floor(avail / w));
    max = addDays(min, totalDays - 1);

    // Top tier: months
    let monthsHtml = "";
    let cursor = new Date(min);
    while (cursor <= max) {
      const mEnd = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 0);
      const to = mEnd < max ? mEnd : max;
      const span = Math.round((to - cursor) / DAY_MS) + 1;
      const label = cursor.toLocaleDateString(undefined, { month: "long", year: "numeric" });
      monthsHtml += `<div class="month-cell" style="width:${span * w}px">${span * w >= 64 ? label : ""}</div>`;
      cursor = addDays(to, 1);
    }

    // Bottom tier: days, plus background day columns
    let daysHtml = "", colsHtml = "";
    for (let i = 0; i < totalDays; i++) {
      const d = addDays(min, i);
      const we = d.getDay() === 0 || d.getDay() === 6;
      const isToday = d.getTime() === today.getTime();
      // At small zoom levels only label Mondays and month starts to avoid clutter
      const showNum = w >= 20 || d.getDay() === 1 || d.getDate() === 1;
      daysHtml += `<div class="day-cell${we ? " weekend" : ""}${isToday ? " today" : ""}" style="width:${w}px">${showNum ? `<span>${d.getDate()}</span>` : ""}</div>`;
      colsHtml += `<div class="day-col${we ? " weekend" : ""}" style="left:${i * w}px;width:${w}px"></div>`;
    }
    const todayOff = Math.round((today - min) / DAY_MS);
    const todayX = todayOff * w + w / 2;
    const todayVisible = todayOff >= 0 && todayOff < totalDays;
    const todayHtml = todayVisible ? `<div class="today-line" style="left:${todayX}px"></div>` : "";
    const todayFlag = todayVisible ? `<div class="today-flag" style="left:${todayX}px">Today</div>` : "";

    // Lanes: one per task, plus a spacer matching each open detail strip
    const lanesHtml = tasks.map(t => {
      const s = parseDate(t.s), e = parseDate(t.e);
      const left = Math.round((s - min) / DAY_MS) * w;
      const width = (Math.round((e - s) / DAY_MS) + 1) * w;
      const color = COLORS[t.c] || COLORS[0];
      const lane = `<div class="lane">
          <div class="bar" style="left:${left + 1}px;width:${width - 2}px;background:${color}" title="${escapeAttr(t.n)} · ${t.s} → ${t.e} · ${t.p}% complete">
            ${t.p > 0 ? `<div class="fill" style="width:${t.p}%"></div>` : ""}
          </div>
          <span class="bar-label" style="left:${left + width + 6}px">${escapeHtml(t.n)}</span>
        </div>`;
      return expanded.has(t) ? lane + `<div class="lane spacer"></div>` : lane;
    }).join("");

    timelineEl.style.width = (totalDays * w) + "px";
    timelineEl.innerHTML = `
      <div class="timescale">
        <div class="tier">${monthsHtml}</div>
        <div class="tier">${daysHtml}</div>
        ${todayFlag}
      </div>
      <div class="tl-body">
        <div class="tl-cols">${colsHtml}</div>
        ${todayHtml}
        ${lanesHtml}
      </div>`;
  }

  // ---------- Wiring ----------
  function update() {
    syncURL();
    renderTimeline();
    document.title = (state.title || "Untitled") + " — Ganttly";
    document.getElementById("printTitle").textContent = state.title || "Untitled Project";
  }

  function addTask() {
    let lastEnd = new Date(); lastEnd.setHours(0, 0, 0, 0);
    state.tasks.forEach(t => { const e = parseDate(t.e); if (e > lastEnd) lastEnd = e; });
    const s = state.tasks.length ? addDays(lastEnd, 1) : lastEnd;
    state.tasks.push({ n: "New task", s: iso(s), e: iso(addDays(s, 4)), c: state.tasks.length % COLORS.length, p: 0 });
    update();
    renderGrid();
    const names = gridBody.querySelectorAll(".row input[data-k=n]");
    const last = names[names.length - 1];
    if (last) { last.focus(); last.select(); }
  }

  document.getElementById("addTaskBtn").addEventListener("click", addTask);

  titleInput.addEventListener("input", () => {
    state.title = titleInput.value;
    update();
  });

  document.getElementById("printBtn").addEventListener("click", () => window.print());

  // ---------- Zoom ----------
  function setZoom(i) {
    const next = clampZoom(i);
    if (next === zoomIdx && document.getElementById("zoomLabel").textContent === ZOOMS[next].label) return;
    zoomIdx = next;
    document.getElementById("zoomLabel").textContent = ZOOMS[zoomIdx].label;
    update();
  }
  document.getElementById("zoomOutBtn").addEventListener("click", () => setZoom(zoomIdx - 1));
  document.getElementById("zoomInBtn").addEventListener("click", () => setZoom(zoomIdx + 1));
  document.addEventListener("keydown", e => {
    if (!(e.ctrlKey || e.metaKey)) return;
    if (e.key === "+" || e.key === "=") { e.preventDefault(); setZoom(zoomIdx + 1); }
    else if (e.key === "-") { e.preventDefault(); setZoom(zoomIdx - 1); }
  });

  document.getElementById("copyLinkBtn").addEventListener("click", async () => {
    const url = location.origin + location.pathname + encodeState();
    try {
      await navigator.clipboard.writeText(url);
      toast("Shareable link copied to clipboard 🔗");
    } catch {
      const ta = document.createElement("textarea");
      ta.value = url; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); ta.remove();
      toast("Shareable link copied to clipboard 🔗");
    }
  });

  // Timeline fills the window width, so redraw when it changes
  let resizeTimer;
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(renderTimeline, 120);
  });

  // ---------- Init ----------
  state = decodeState() || defaultState();
  titleInput.value = state.title;
  document.getElementById("zoomLabel").textContent = ZOOMS[zoomIdx].label;
  syncURL();
  renderGrid();
  update();
})();
</script>
</body>
</html>
